name: CI

# Build + test gate for every pull request and every push to main.
# The solution sets TreatWarningsAsErrors + EnforceCodeStyleInBuild, so this
# job also enforces analyzer/style cleanliness — but only if something runs it,
# which is the whole point of this workflow.

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

# A newer push to the same branch/PR cancels the in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  build-test:
    # Windows-only product (WinUI 3, registry/process operations, named pipes).
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET (from global.json)
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore WinEvo.slnx

      - name: Build (Release, warnings-as-errors)
        run: dotnet build WinEvo.slnx -c Release --no-restore

      - name: Test
        run: dotnet test WinEvo.slnx -c Release --no-build --verbosity normal
